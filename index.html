<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Travel Bill Editor</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #fff;
      --tx: #1b1f24;
      --mu: #6a727c;
      --bd: #d5d9df;
      --ac: #1f5fbf;
      --acx: #fff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #3f5b81;
        --card: #1d2127;
        --tx: #e8eaed;
        --mu: #9aa3ad;
        --bd: #38404a;
        --ac: #5b9dff;
        --acx: #0c1522;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #14171b;
      --card: #1d2127;
      --tx: #e8eaed;
      --mu: #9aa3ad;
      --bd: #38404a;
      --ac: #5b9dff;
      --acx: #0c1522;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px
    }

    h1 {
      font-size: 20px;
      margin: 4px 0 12px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px
    }

    .card h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--mu);
      margin: 0 0 10px
    }

    .g {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px
    }

    label {
      display: block;
      font-size: 18px;
      color: var(--mu)
    }

    input,
    textarea {
      width: 100%;
      margin-top: 3px;
      padding: 8px;
      border: 1px solid var(--bd);
      border-radius: 6px;
      background: var(--bg);
      color: var(--tx);
      font: inherit
    }

    input[readonly] {
      opacity: .8;
      font-weight: 600
    }

    .full {
      grid-column: 1/-1
    }

    .tot {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      padding-top: 8px
    }

    .bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--ac);
      /* color: var(--acx) */
    }

    button.s {
      /* background: transparent; */
      color: var(--tx);
      /* border: 1px solid var(--bd) */
    }

    #msg {
      margin-top: 8px;
      color: var(--mu);
      font-size: 13px;
      min-height: 18px
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Travel Bill Editor</h1>

    <div class="card">
      <h2>Your company (letterhead / footer)</h2>
      <div class="g">
        <label>Company name<input data-k="co" value="Shravani Travels"></label>
        <label>Contact<input data-k="coPh" value="+91 9028208808"></label>
        <label class="full">Address<input data-k="coAdd" value="Plot no.11 Ramdas nagar,Susgaon Pune."></label>
        <label>Email<input data-k="coMail" value="krushna.chavan84@gmail.com"></label>
        <label>Your GST No.<input data-k="coGst" value=""></label>
      </div>
    </div>

    <div class="card">
      <h2>Bill details</h2>
      <div class="g">
        <label>Ref No.<input data-k="ref" value="831"></label>
        <label>Bill No.<input data-k="billNo" value="0831/26-27"></label>
        <label>Bill Date<input data-k="billDate" value="26/09/2026"></label>
        <label>Vehicle Make<input data-k="make" value="Baleno/AC"></label>
        <label>Vehicle No.<input data-k="vno" value="MH-12-VZ-6665"></label>
        <label>Driver<input data-k="driver" value="Krushna"></label>
      </div>
    </div>

    <div class="card">
      <h2>Billed to</h2>
      <div class="g">
        <label>Name<input data-k="to" value="Phoenix Contact (I) Pvt Ltd."></label>
        <label>Address<input data-k="toAdd" value="Shivaji Nagar Pune."></label>
        <label>Contact<input data-k="toPh" value=""></label>
        <label>Kind Attn<input data-k="attn" value="Mr.Gopal Sir"></label>
        <label>Client GST No.<input data-k="toGst" value=""></label>
      </div>
    </div>

    <div class="card">
      <h2>Trip</h2>
      <div class="g">
        <label>Trip type<input data-k="type" value="Outstation"></label>
        <label>Route<input data-k="route" value="Pune-Mumbai-Pune"></label>
        <label>Trip date<input data-k="tdate" value="23/09/2026"></label>
        <label>Kms<input data-k="kms" type="number" step="any" value="343"></label>
        <label>Rate / Km<input data-k="rate" type="number" step="any" value="13"></label>
        <label>Trip amount (auto)<input id="tripAmt" readonly></label>
        <label>Total Kms of local trip<input data-k="localKms" value=""></label>
        <label>Fixed fare (80 Kms &amp; 8 Hrs)<input data-k="fixed" type="number" step="any" value=""></label>
        <label>Extra Kms charges<input data-k="exKm" type="number" step="any" value=""></label>
        <label>Extra Hours charges<input data-k="exHr" type="number" step="any" value=""></label>
        <label>Toll charges<input data-k="toll" type="number" step="any" value="640"></label>
        <label>Parking charges<input data-k="park" type="number" step="any" value=""></label>
        <label>Night halt<input data-k="night" type="number" step="any" value=""></label>
      </div>
    </div>

    <div class="card">
      <h2>Tax &amp; payment</h2>
      <div class="g">
        <label>CGST %<input data-k="cg" type="number" step="any" value=""></label>
        <label>SGST %<input data-k="sg" type="number" step="any" value=""></label>
        <label>Advance received<input data-k="adv" type="number" step="any" value=""></label>
      </div>
      <div class="tot"><span>Total Bill Amount</span><span id="tBill"></span></div>
      <div class="tot"><span>Net Amount Payable</span><span id="tNet"></span></div>
    </div>

    <div class="bar"><button id="dl">Download PDF</button><button class="s" id="pr">Print</button><button class="s"
        id="rs">Clear saved data</button></div>
    <div id="msg"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    var els = [].slice.call(document.querySelectorAll('[data-k]'));
    var KEY = 'travelBillV1';
    function v(k) { var e = document.querySelector('[data-k="' + k + '"]'); return e ? e.value.trim() : '' }
    function n(k) { var x = parseFloat(v(k)); return isNaN(x) ? 0 : x }
    function inr(x) { return Number(x).toLocaleString('en-IN', { maximumFractionDigits: 2 }) }
    function calc() {
      var trip = Math.round(n('kms') * n('rate') * 100) / 100;
      var total = trip + n('fixed') + n('exKm') + n('exHr') + n('toll') + n('park') + n('night');
      var cg = Math.round(total * n('cg')) / 100, sg = Math.round(total * n('sg')) / 100;
      var net = total + cg + sg - n('adv');
      return { trip: trip, total: total, cg: cg, sg: sg, net: net };
    }
    function refresh() {
      var c = calc();
      document.getElementById('tripAmt').value = inr(c.trip);
      document.getElementById('tBill').textContent = 'Rs. ' + inr(c.total);
      document.getElementById('tNet').textContent = 'Rs. ' + inr(c.net);
      try { var o = {}; els.forEach(function (e) { o[e.dataset.k] = e.value }); localStorage.setItem(KEY, JSON.stringify(o)) } catch (e) { }
    }
    try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) els.forEach(function (e) { if (s[e.dataset.k] !== undefined) e.value = s[e.dataset.k] }) } catch (e) { }
    els.forEach(function (e) { e.addEventListener('input', refresh) });
    refresh();
    function msg(t) { document.getElementById('msg').textContent = t }
    function dash(x) { return x ? inr(x) : '-' }

    function buildPdf() {
      var J = window.jspdf.jsPDF, d = new J({ unit: 'mm', format: 'a4' }), c = calc();
      var L = 12, R = 198, W = R - L, y = 14;
      d.setDrawColor(0); d.setLineWidth(.3);
      d.setFont('helvetica', 'bold'); d.setFontSize(18); d.text(v('co'), 105, y, { align: 'center' });
      d.setFont('helvetica', 'normal'); d.setFontSize(9);
      d.text(v('coAdd'), 105, y + 6, { align: 'center' });
      d.text('Contact: ' + v('coPh') + '   Email: ' + v('coMail') + (v('coGst') ? '   GST: ' + v('coGst') : ''), 105, y + 11, { align: 'center' });
      y = 32; d.line(L, y, R, y);
      // header block
      var rows = [['Ref No.', v('ref')], ['Bill Date', v('billDate')], ['Bill No.', v('billNo')], ['Vehicle Make', v('make')], ['Vehicle No.', v('vno')], ['Driver', v('driver')]];
      d.setFontSize(10);
      d.setFont('helvetica', 'bold'); d.text('To,', L + 2, y + 6);
      d.text('Name:', L + 2, y + 12); d.text('Add:', L + 2, y + 18); d.text('Contact:', L + 2, y + 24); d.text('Kind Attn:', L + 2, y + 30); d.text('GST NO.:', L + 2, y + 36);
      d.setFont('helvetica', 'normal');
      d.text(v('to'), L + 22, y + 12); d.text(v('toAdd'), L + 22, y + 18); d.text(v('toPh'), L + 22, y + 24); d.text(v('attn'), L + 22, y + 30); d.text(v('toGst'), L + 22, y + 36);
      var vx = 125;
      var ry = [y + 6, y + 12, y + 18, y + 24, y + 30, y + 36];
      rows.forEach(function (r, i) { d.setFont('helvetica', 'bold'); d.text(r[0], vx, ry[i]); d.setFont('helvetica', 'normal'); d.text(': ' + r[1], vx + 28, ry[i]) });
      d.line(vx - 3, y, vx - 3, y + 40);
      y += 40; d.line(L, y, R, y);
      // table header
      var cx = [L, 98, 122, 146, R];
      d.setFont('helvetica', 'bold');
      d.text('Description', L + 2, y + 6); d.text('Kms/Hrs', cx[1] + 2, y + 6); d.text('Rate/Km', cx[2] + 2, y + 6); d.text('Amount (Rs.)', R - 2, y + 6, { align: 'right' });
      y += 9; d.line(L, y, R, y);
      var top = y;
      d.setFont('helvetica', 'normal');
      var ty = y + 6;
      d.setFont('helvetica', 'bold'); d.text('Trip Details : ' + v('type'), L + 2, ty);
      d.text(v('route'), L + 2, ty + 6); d.text(v('vno'), L + 2, ty + 12);
      d.text('dated ' + v('tdate'), L + 2, ty + 18);
      d.setFont('helvetica', 'normal'); d.text(v('kms'), cx[1] + 2, ty + 18); d.text(v('rate'), cx[2] + 2, ty + 18); d.text(inr(c.trip), R - 2, ty + 18, { align: 'right' });
      var lines = [
        ['Total Kms Of Local Trip', v('localKms') || '-', ''],
        ['Fixed Fare for 80 Kms & 8 Hrs', '', dash(n('fixed'))],
        ['Add : Extra Kms Charges', '', dash(n('exKm'))],
        ['Add : Extra Hours Charges', '', dash(n('exHr'))],
        ['Add: Toll Charges', '', dash(n('toll'))],
        ['Add: Parking Charges', '', dash(n('park'))],
        ['Add: Night Halt', '', dash(n('night'))]];
      var ly = ty + 30;
      lines.forEach(function (r, i) { var yy = ly + i * 7; d.setFont('helvetica', 'bold'); d.text(r[0], L + 2, yy); d.setFont('helvetica', 'normal'); if (r[1]) d.text(String(r[1]), cx[1] + 2, yy); if (r[2]) d.text(r[2], R - 2, yy, { align: 'right' }) });
      y = ly + 7 * lines.length - 2;
      d.line(L, y, R, y);
      var sum = [['Total Bill Amount', inr(c.total), 1], ['Add:- CGST' + (n('cg') ? ' @' + n('cg') + '%' : ''), dash(c.cg)], ['Add:- SGST' + (n('sg') ? ' @' + n('sg') + '%' : ''), dash(c.sg)], ['TOTAL GST', dash(c.cg + c.sg)], ['(Less) Advance Received', dash(n('adv'))], ['Net Amount Payable', inr(c.net), 1]];
      sum.forEach(function (r, i) { var yy = y + 6 + i * 7; d.setFont('helvetica', 'bold'); d.text(r[0], L + 2, yy); d.setFont('helvetica', r[2] ? 'bold' : 'normal'); d.text(r[1], R - 2, yy, { align: 'right' }) });
      var end = y + 6 + sum.length * 7 - 3;
      d.line(L, end, R, end);
      [cx[1], cx[2], cx[3]].forEach(function (x) { d.line(x, top - 9, x, y) });
      d.line(cx[3], y, cx[3], end);
      // outer box
      d.rect(L, 32 - 0, W, end - 32);
      // footer
      d.setFont('helvetica', 'bold'); d.setFontSize(10);
      d.text('For ' + v('co'), R, end + 14, { align: 'right' });
      d.setFont('helvetica', 'normal'); d.text('(Authorized Signatory)', R, end + 34, { align: 'right' });
      d.setFontSize(9); d.text(v('coAdd'), L, end + 14); d.text('Contact : ' + v('coPh'), L, end + 19); d.text('Email : ' + v('coMail'), L, end + 24);
      return d;
    }

    document.getElementById('dl').onclick = async function () {
      try {
        if (!window.jspdf) { msg('PDF library did not load. Check your connection and retry.'); return }
        var d = buildPdf();
        var name = 'Bill_' + (v('billNo') || 'bill').replace(/[\/\\]/g, '-') + '.pdf';
        var dls = null;
        try { dls = window.claude && await window.claude.use('downloads') } catch (e) { }
        if (dls) {
          await dls.save({ filename: name, data: d.output('arraybuffer') });
          msg('Saved ' + name);
        } else {
          d.save(name); msg('Downloaded ' + name);
        }
      } catch (e) { msg(e && e.code === 'declined' ? 'Download cancelled.' : 'Could not download: ' + ((e && e.message) || e)) }
    };
    document.getElementById('pr').onclick = function () {
      try { var d = buildPdf(); var u = d.output('bloburl'); window.open(u, '_blank') || msg('Pop-up blocked. Use Download PDF instead.') } catch (e) { msg('Could not open preview.') }
    };
    document.getElementById('rs').onclick = function () { try { localStorage.removeItem(KEY) } catch (e) { } msg('Saved data cleared. Reload to restore defaults.') };
  </script>
</body>

</html>
